name: Release builds

# Builds goplay for macOS, Linux and Windows when a release is published,
# and attaches the packages to it. A manual run takes a tag, to build an
# existing release again.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the packages to
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # This workflow's own revision, for the packaging scripts: an older
      # release can then be packaged with current tooling.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .tools
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install libmpv, FFmpeg and dylibbundler
        run: |
          brew install mpv pkg-config ffmpeg dylibbundler
          # Homebrew's mpv.pc can name a Cellar folder that isn't there;
          # its stable prefix always is.
          echo "CGO_LDFLAGS=-L$(brew --prefix)/lib" >> "$GITHUB_ENV"
          echo "CGO_CFLAGS=-I$(brew --prefix)/include" >> "$GITHUB_ENV"
      - name: Test
        run: |
          .tools/scripts/test-media.sh "$RUNNER_TEMP/media"
          go vet ./...
          GOPLAY_TEST_MEDIA="$RUNNER_TEMP/media/chapters.mkv" GOPLAY_TEST_MEDIA_DIR="$RUNNER_TEMP/media" go test ./...
      - name: Package
        run: .tools/scripts/package.sh "$TAG"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.zip --clobber

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # This workflow's own revision, for the packaging scripts: an older
      # release can then be packaged with current tooling.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .tools
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install libmpv, FFmpeg and GLFW's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev ffmpeg pkg-config \
            libx11-dev libxrandr-dev libxxf86vm-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev
      - name: Test
        run: |
          .tools/scripts/test-media.sh "$RUNNER_TEMP/media"
          go vet ./...
          GOPLAY_TEST_MEDIA="$RUNNER_TEMP/media/chapters.mkv" GOPLAY_TEST_MEDIA_DIR="$RUNNER_TEMP/media" go test ./...
      - name: Package
        run: .tools/scripts/package.sh "$TAG"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.tar.gz --clobber

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # This workflow's own revision, for the packaging scripts: an older
      # release can then be packaged with current tooling.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .tools
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-angleproject
      - name: Test
        env:
          CGO_ENABLED: "1"
        run: |
          .tools/scripts/test-media.sh "$RUNNER_TEMP/media"
          go vet ./...
          GOPLAY_TEST_MEDIA="$RUNNER_TEMP/media/chapters.mkv" GOPLAY_TEST_MEDIA_DIR="$RUNNER_TEMP/media" go test ./...
      - name: Package
        run: .tools/scripts/package.sh "$TAG"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.zip --clobber
