name: Release builds

# Builds goplay with the giode CLI for macOS, Linux and Windows on
# Intel/AMD and ARM when a release is published, and attaches the
# packages to it. A manual run with a tag builds that release again;
# without one it builds the chosen branch and keeps the packages as the
# run's artifacts.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the packages to (empty to only build the branch)
        required: false

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  REF: ${{ github.event.release.tag_name || inputs.tag || github.sha }}

jobs:
  macos:
    name: macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install libmpv, FFmpeg and the giode CLI
        run: |
          brew install mpv pkg-config ffmpeg
          # Homebrew's mpv.pc can name a Cellar folder that isn't there;
          # its stable prefix always is.
          echo "CGO_LDFLAGS=-L$(brew --prefix)/lib" >> "$GITHUB_ENV"
          echo "CGO_CFLAGS=-I$(brew --prefix)/include" >> "$GITHUB_ENV"
          go install github.com/mehran9675/giode-cli/cmd/giode@latest
      - name: Test
        run: |
          scripts/test-media.sh "$RUNNER_TEMP/media"
          go vet ./...
          GOPLAY_TEST_MEDIA="$RUNNER_TEMP/media/chapters.mkv" GOPLAY_TEST_MEDIA_DIR="$RUNNER_TEMP/media" go test ./...
      - name: Package
        run: |
          scripts/ci-version.sh
          giode build -arch arm64 dmg
          scripts/ci-collect.sh macos arm64
      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/* --clobber
      - uses: actions/upload-artifact@v4
        if: env.TAG == ''
        with:
          name: goplay-macos-arm64
          path: out/*

  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install libmpv, FFmpeg, Gio's libraries and the giode CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev ffmpeg pkg-config gcc \
            libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev \
            libffi-dev libxcursor-dev libvulkan-dev
          go install github.com/mehran9675/giode-cli/cmd/giode@latest
      - name: Test
        run: |
          scripts/test-media.sh "$RUNNER_TEMP/media"
          go vet ./...
          GOPLAY_TEST_MEDIA="$RUNNER_TEMP/media/chapters.mkv" GOPLAY_TEST_MEDIA_DIR="$RUNNER_TEMP/media" go test ./...
      - name: Package
        run: |
          scripts/ci-version.sh
          giode build -arch ${{ matrix.arch }} linux deb rpm
          scripts/ci-collect.sh linux ${{ matrix.arch }}
      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/* --clobber
      - uses: actions/upload-artifact@v4
        if: env.TAG == ''
        with:
          name: goplay-linux-${{ matrix.arch }}
          path: out/*

  windows:
    name: Windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, mpv: x86_64, runner: windows-latest, msystem: UCRT64, pkg: mingw-w64-ucrt-x86_64, cc: gcc }
          - { arch: arm64, mpv: aarch64, runner: windows-11-arm, msystem: CLANGARM64, pkg: mingw-w64-clang-aarch64, cc: clang }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          # The runner's own MSYS2, in C:\msys64 where giode.toml's
          # [native.windows] search looks.
          release: false
          path-type: inherit
          update: true
          install: >-
            zip
            ${{ matrix.pkg }}-${{ matrix.cc }}
            ${{ matrix.pkg }}-pkgconf
            ${{ matrix.pkg }}-ffmpeg
            ${{ matrix.pkg }}-angleproject
            mingw-w64-ucrt-x86_64-nsis
      - name: Get libmpv, ANGLE and the giode CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # shinchiro's libmpv is one self-contained DLL; ANGLE comes from
          # Edge, whose DLLs need nothing else. See giode.toml's
          # [native.windows].
          set -x
          env_file="$(cygpath -u "$GITHUB_ENV")" path_file="$(cygpath -u "$GITHUB_PATH")"
          mkdir -p build/native build/libmpv
          tmp="$(cygpath -u "$RUNNER_TEMP")"
          gh release download -R shinchiro/mpv-winbuild-cmake -p "mpv-dev-${{ matrix.mpv }}-[0-9]*.7z" -D "$tmp"
          # MSYS2's p7zip is too old for these archives' filters; Windows'
          # own tar (libarchive) reads them.
          /c/Windows/System32/tar.exe -xf "$(cygpath -w "$(ls "$tmp"/mpv-dev-*.7z)")" -C "$(cygpath -w "$PWD/build/libmpv")"
          cp build/libmpv/libmpv-2.dll build/native/
          prefix="$(cygpath -m "$PWD/build/libmpv")"
          printf 'prefix=%s\nlibdir=${prefix}\nincludedir=${prefix}/include\n\nName: mpv\nDescription: libmpv\nVersion: 0.40.0\nLibs: -L${libdir} -lmpv\nCflags: -I${includedir}\n' "$prefix" > build/libmpv/mpv.pc
          echo "PKG_CONFIG_PATH=$prefix" >> "$env_file"
          angle=""
          for f in "/c/Program Files (x86)/Microsoft/Edge/Application"/*/libEGL.dll "/c/Program Files/Microsoft/Edge/Application"/*/libEGL.dll; do
            if [ -f "$f" ]; then angle="$f"; break; fi
          done
          if [ -n "$angle" ]; then
            cp "$angle" "$(dirname "$angle")/libGLESv2.dll" build/native/
          else
            cp "$MINGW_PREFIX/bin/libEGL.dll" "$MINGW_PREFIX/bin/libGLESv2.dll" build/native/
          fi
          echo "$(cygpath -w "$PWD/build/native")" >> "$path_file"
          echo "C:\\msys64\\ucrt64\\bin" >> "$path_file"
          go install github.com/mehran9675/giode-cli/cmd/giode@latest
      - name: Test
        run: |
          export PATH="$PWD/build/native:$PATH"
          scripts/test-media.sh "$RUNNER_TEMP/media"
          go vet ./...
          GOPLAY_TEST_MEDIA="$RUNNER_TEMP/media/chapters.mkv" GOPLAY_TEST_MEDIA_DIR="$RUNNER_TEMP/media" go test ./...
      - name: Package
        run: |
          export PATH="$PATH:/c/msys64/ucrt64/bin"
          scripts/ci-version.sh
          giode build -arch ${{ matrix.arch }} windows windows-installer
          scripts/ci-collect.sh windows ${{ matrix.arch }}
      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/* --clobber
      - uses: actions/upload-artifact@v4
        if: env.TAG == ''
        with:
          name: goplay-windows-${{ matrix.arch }}
          path: out/*
