# Project file for the giode CLI (github.com/Mehran9675/giode-cli).
#
#   giode run                   build and run on this computer
#   giode build desktop         this computer's packages
#   giode build dmg             macOS: the app in a disk image
#   giode build windows-installer
#   giode build deb             (and linux, rpm, appimage)
#
# GoPlay draws video under its UI with Giode's underlay and OpenGL, and
# links libmpv with cgo; [native] bundles libmpv and what it loads. On
# Windows the CLI bundles ANGLE too (renderer = "opengl"); libmpv goes in
# build/native first (see the README).

[app]
name = "GoPlay"
id = "com.mehran9675.goplay"
version = "1.1.0"
build = 2
icon = "assets/icon.png"
package = "."
publisher = "Mehran Zahiroddini"
description = "A fast, beautiful video player that plays almost anything."
website = "https://github.com/Mehran9675/goplay"
renderer = "opengl"
ldflags = "-X github.com/mehran9675/goplay/internal/app.Version={version}"

[macos]
min_os = 11

[macos.usage]
local_network = "GoPlay looks for Chromecast and DLNA devices on your network so you can cast to them."

[macos.plist]
NSBonjourServices = ["_googlecast._tcp"]

[windows]
arch = "amd64"
cc = "cc"

[windows.installer]
per_machine = false
desktop_shortcut = true

[linux]
categories = ["AudioVideo", "Video", "Player"]
description = "A video player built on mpv: hardware decoding, subtitles, 3D and 360° video, casting to Chromecast and DLNA."
maintainer = "Mehran <61628815+Mehran9675@users.noreply.github.com>"
license = "MIT"

[native]
bundle = true

[native.windows]
search = ["build/native", "$MSYSTEM_PREFIX/bin"]

[native.macos]
search = ["/opt/homebrew/lib", "/usr/local/lib"]

[native.linux]
system = true
deb_depends = ["libmpv2 | libmpv1"]
rpm_requires = ["mpv-libs"]

[[file_types]]
name = "Video"
extensions = ["mkv", "mk3d", "webm", "mp4", "m4v", "mov", "avi", "ts", "m2ts", "mts", "flv", "wmv", "mpg", "mpeg", "ogv", "vob", "3gp"]
mime_types = ["video/x-matroska", "video/webm", "video/mp4", "video/quicktime", "video/x-msvideo", "video/mp2t", "video/x-flv", "video/x-ms-wmv", "video/mpeg", "video/ogg", "video/3gpp"]

[[file_types]]
name = "Audio"
extensions = ["mp3", "flac", "ogg", "opus", "m4a", "aac", "wav", "wma"]
mime_types = ["audio/mpeg", "audio/flac", "audio/ogg", "audio/opus", "audio/mp4", "audio/aac", "audio/x-wav", "audio/x-ms-wma"]

[[context_actions]]
id = "play"
label = "Play with GoPlay"
extensions = [".mkv", ".mk3d", ".webm", ".mp4", ".m4v", ".mov", ".avi", ".ts", ".m2ts", ".mts", ".flv", ".wmv", ".mpg", ".mpeg", ".ogv", ".vob", ".3gp", ".mp3", ".flac", ".ogg", ".opus", ".m4a", ".aac", ".wav", ".wma"]
folders = true
